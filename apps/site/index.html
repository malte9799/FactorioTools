<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Defence in depth behind the escaping in blueprint-viewer/html.ts: a
      pasted blueprint is untrusted input, so if a sink is ever missed, this
      still stops the payload from loading outside script or phoning anything
      home. It does NOT stop an inline event handler in innerHTML-inserted
      markup — script-src does not cover those — which is why the escaping,
      not this header, is the actual fix.

      style-src needs 'unsafe-inline' because the app sets element.style
      directly (tooltip transform, floating windows) and Google Fonts serves
      its face declarations as a stylesheet from fonts.googleapis.com, with
      the font files themselves on fonts.gstatic.com.
      img-src needs data: for the sprite/icon canvases.

      frame-ancestors is deliberately absent: browsers ignore it in a <meta>
      element (it only works as a real HTTP header) and including it just
      logs a console error. Set it, along with X-Content-Type-Options and
      Referrer-Policy, on the host if it allows custom headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data: blob:;
               connect-src 'self';
               worker-src 'self' blob:;
               base-uri 'none';
               object-src 'none';
               form-action 'none'"
    />
    <title>FactorioTools</title>
    <meta
      name="description"
      content="Blueprint viewer and rate calculator for Factorio — paste a blueprint string, see it rendered and read real production rates. No mods needed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="nav-root"></div>
    <main id="tool-root"></main>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
